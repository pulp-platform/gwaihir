name: lint

on:
  pull_request:
  push:
    branches:
      - main

jobs:

  ###############
  # Pre-commit  #
  ###############
  # Runs the same hooks as the local pre-commit install, so .pre-commit-config.yaml
  # is the single source of truth for SV linting, formatting, REUSE and tool versions.
  # The reuse-lint-file hook is skipped because it only checks staged files, which is not relevant in CI.
  pre-commit:
    name: Run pre-commit hooks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          # needed to find the base commit of a PR
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v9.0.0
      - name: Run hooks on changed files
        env:
          FROM_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: uvx prek@0.4.11 run --from-ref "$FROM_REF" --to-ref HEAD --show-diff-on-failure
