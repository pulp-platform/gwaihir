variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

# Check the cache for bender and python dependencies
.cache-deps:
  cache: &global_cache
    key:
      files:
        - Bender.lock
    paths:
      - .bender
    policy: pull

# Update the cache with bender and python dependencies
.init-deps-tpl:
  script:
    # Initialize the PD repository
    - make init-pd
    # Collect bender sources
    - bender checkout
  cache:
    # inherit all global cache settings
    <<: *global_cache
    policy: pull-push
  # bender checkout sometimes fails,
  # due to rate limiting of github
  retry: 1

# Compile the snitch software tests
.sn-sw-tpl:
  stage: build
  extends:
    - .cache-deps
    - .init-env
  script:
    - make sn-tests DEBUG=ON
    - make sn-apps DEBUG=ON
  artifacts:
    paths:
      - sw/snitch/tests/build/*.elf
      - sw/snitch/apps/**/build/*.elf
    expire_in: 1 day

# Compile the cheshire software tests
.chs-sw-tpl:
  extends:
    - .cache-deps
    - .init-env
  script:
    - make chs-sw-tests
  artifacts:
    paths:
      - sw/cheshire/tests/*.elf
    expire_in: 1 day

.check-simulation:
  script:
    # Check either success or failure for non-zero exit codes
    - 'if [ -z "${NZ_EXIT_CODE}" ]; then grep "] SUCCESS" "${LOG_FILE}" || (exit 1); else grep "] FAILED: return code ${NZ_EXIT_CODE}" "${LOG_FILE}" || (exit 1); fi'
    # Check for UART output
    - 'if [ ! -z "${USTR}" ]; then (grep " \[UART\] ${USTR}" "${LOG_FILE}"); fi'
    # Check for any fatal errors
    - 'if grep "Fatal:" "${LOG_FILE}"; then exit 1; fi'
    # Check for any non-fatal errors. One and only one error is expected with a non-zero exit code.
    # Ignore all errors when using a separate verification script.
    - 'if [ -z "${VERIFY_PY}" ]; then if [ ! -z "${NZ_EXIT_CODE}" ]; then count=$(grep -c "Error:" "${LOG_FILE}"); if [ "$count" -ne 1 ]; then exit 1; fi; else if grep -q "Error:" "${LOG_FILE}"; then exit 1; fi; fi; fi'
