[project]
name = "gwaihir"
version = "0.1.0"
description = "aka Lago-Mio"
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "floogen>=0.8.1",
    "peakrdl>=1.5.0",
    "peakrdl-rawheader>=0.2.5",
    "snitch[kernels]",
    "cheshire",
]

[dependency-groups]
dev = [
    "mako>=1.3.10",
    "pyyaml>=6.0.3",
    "reuse>=6.2.0",
]
docs = [
    "peakrdl-markdown>=1.0.3",
    "zensical>=0.0.46",
]

[tool.uv.workspace]
members = [
    # To locally edit floogen, run `bender clone floo_noc` and add:
    # "working_dir/floo_noc",
    # Note: .deps/floo_noc cannot be used here because uv_build does not
    # support symlinks as workspace members (https://github.com/astral-sh/uv/issues/15243).
    ".deps/snitch_cluster",
    ".deps/cheshire",
]

[tool.uv.sources]
# To locally edit floogen, also uncomment:
# floogen = { workspace = true, editable = true }
floogen = { git = "https://github.com/pulp-platform/FlooNoC.git", rev = "9d2f0a77ac59b62f40391a120e43f33cada868a3" }
snitch = { workspace = true, editable = true }
cheshire = { workspace = true }
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["uv_build>=0.6,<1"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = "experiments"
