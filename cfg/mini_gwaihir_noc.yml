name: gwaihir
description: "gwaihir NoC configuration"
network_type: "narrow-wide"

routing:
  route_algo: "XY"
  use_id_table: true
  collective:
    en_narrow_multicast: true
    en_wide_multicast: true
    en_barrier: true
    en_wide_reduction:       # selective FP ops, default hw config
      rd_pipeline_depth: 5
      cut_offload_intf: true
  decouple_rw: Phys
  vc_impl: naive

protocols:
  - name: "narrow_in"
    type: "narrow"
    protocol: "AXI4"
    data_width: 64
    addr_width: 48
    id_width: 5
    user_width:
      collective_mask: 48
      collective_op: 4
      user: 6
  - name: "narrow_out"
    type: "narrow"
    protocol: "AXI4"
    data_width: 64
    addr_width: 48
    id_width: 2
    user_width:
      collective_mask: 48
      collective_op: 4
      user: 6
  - name: "wide_in"
    type: "wide"
    protocol: "AXI4"
    data_width: 512
    addr_width: 48
    id_width: 3
    user_width:
      collective_mask: 48
      collective_op: 4
  - name: "wide_out"
    type: "wide"
    protocol: "AXI4"
    data_width: 512
    addr_width: 48
    id_width: 1
    user_width:
      collective_mask: 48
      collective_op: 4

endpoints:
  - name: "cluster"
    array: [2, 2]
    addr_range:
      base: 0x2000_0000
      size: 0x0004_0000
      rdl_name: "snitch_cluster"
      en_collective: true
    mgr_port_protocol:
      - "narrow_in"
      - "wide_in"
    sbr_port_protocol:
      - "narrow_out"
      - "wide_out"
  - name: "cheshire"
    addr_range:
      - start: 0x0000_0000
        end: 0x2000_0000
        desc: "internal"
        rdl_name: "cheshire_tile"
      - start: 0x8000_0000
        end: 0x200_0000_0000
        desc: "external"
        rdl_name: "cheshire_external"
    mgr_port_protocol:
      - "narrow_in"
    sbr_port_protocol:
      - "narrow_out"
      - "wide_out"
  - name: "l2_spm"
    array: [2]
    addr_range:
      - base: 0x7000_0000
        size: 0x0010_0000
      - base: 0x4000_0000
        size: 0x200
        desc: "dma"
    sbr_port_protocol:
      - "narrow_out"
      - "wide_out"

routers:
  - name: "router"
    array: [4, 2]
    degree: 5

connections:
  - src: "cluster"
    dst: "router"
    src_range:
    - [0, 1]
    - [0, 1]
    dst_range:
    - [0, 1]
    - [0, 1]
    dst_dir: "Eject"
  - src: "cheshire"
    dst: "router"
    dst_idx: [3, 1]
    dst_dir: "Eject"
  - src: "l2_spm"
    dst: "router"
    src_range:
      - [0, 1]
    dst_range:
      - [2, 2]
      - [0, 1]
    dst_dir: "Eject"
