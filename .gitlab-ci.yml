include:
  - local: .gitlab/common.yml
  - local: .gitlab/sw-tests.yml

default:
  interruptible: true

stages:
  - build
  - run

# Sources the environment variables for the IIS environment
.init-env:
  before_script:
    # Persist the uv and bender caches across pipelines. The shared runners
    # expose a per-runner cache via $CACHEDIR; the gwaihir-pd runner does not,
    # so fall back to a per-runner dir next to the builds dir (as we did before).
    - export CACHEDIR="${CACHEDIR:-$CI_BUILDS_DIR/../cache}"
    # uv: the cache may live on a different filesystem than the build dir, so copy.
    - export UV_CACHE_DIR="$CACHEDIR/uv"
    - export UV_LINK_MODE=copy
    # bender: keep per-project checkouts under ./.bender, share only the git db.
    - export BENDER_DB_DIR="$CACHEDIR/bender"
    - source iis-env.sh

##################
# Initialization #
##################

init-pd:
  stage: build
  extends:
    - .init-env
  # Initialize the PD repository (provides pd/ci.yml for the subpipe trigger)
  script:
    - make init-pd
  artifacts:
    paths:
      - pd/ci.yml

########################
# Build Software Tests #
########################

sn-sw:
  stage: build
  extends:
    - .sn-sw-tpl

chs-sw:
  stage: build
  extends:
    - .chs-sw-tpl

#####################
# Build Simulations #
#####################

vsim-compile:
  stage: build
  extends:
    - .init-env
  script:
    - make gwaihir-hw-all
    - make vsim-compile | tee compile.log 2>&1
    - '! grep "\*\* Error" compile.log'
  artifacts:
    paths:
      - target/sim/vsim/work
    expire_in: 2 day

vcs-compile:
  stage: build
  extends:
    - .init-env
  script:
    - make gwaihir-hw-all
    - make vcs-compile-batch | tee compile.log 2>&1
    - '! grep "Error-\[" compile.log'
  artifacts:
    paths:
      - target/sim/vcs/build
    expire_in: 2 day

###################
# Run simulations #
###################

sim-vsim:
  stage: run
  extends:
    - .init-env
    - .sw-tests
  variables:
    LOG_FILE: transcript
  needs:
    - chs-sw
    - sn-sw
    - vsim-compile
  script:
    - make vsim-run-batch-verify
    - !reference [.check-simulation, script]
  artifacts:
    paths:
      - ${LOG_FILE}

sim-vcs:
  stage: run
  extends:
    - .init-env
  variables:
    LOG_FILE: transcript
    CHS_BINARY: sw/cheshire/tests/simple_offload.spm.elf
    SN_BINARY: sw/snitch/apps/mha/build/mha.elf
    VERIFY_PY: .deps/snitch_cluster/sw/kernels/dnn/mha/scripts/verify.py
    PRELMODE: 3
  needs:
    - chs-sw
    - sn-sw
    - vcs-compile
  script:
    # Run the VCS simulation and capture the console output into a log file
    - make vcs-run-batch-verify 2>&1 | tee ${LOG_FILE}
    - !reference [.check-simulation, script]
  artifacts:
    paths:
      - ${LOG_FILE}

#####################
# Run Experiments   #
#####################

sim-exps:
  stage: run
  extends:
    - .init-env
  needs:
    - chs-sw
    - sn-sw
    - vsim-compile
  parallel:
    matrix:
      - EXPERIMENT: multicast
      - EXPERIMENT: reduction
      - EXPERIMENT: barrier
  script:
    - make sn-sw-submodules
    - cd experiments/$EXPERIMENT && ./experiments.py --ci --actions sw run -j
  artifacts:
    expire_in: 2 days

###################
# Physical Design #
###################

subpipe:
  stage: build
  interruptible: true
  needs:
    - job: init-pd
      artifacts: true
  trigger:
    include:
      - artifact: pd/ci.yml
        job: init-pd
    strategy: depend
